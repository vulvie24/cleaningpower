<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CleaningPower Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sidebar nav on desktop, bottom tab bar on phone; sheets slide up for every editor */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#EEF3F4; --ink:#0E1B22; --muted:#5B6A72; --line:#DFE6E9;
  --accent:#0A7A8A; --accent-ink:#FFFFFF; --accent-soft:#DCEFF2;
  --good:#1D8350; --good-soft:#DFF3E7; --warn:#A86A0E; --warn-soft:#FBEFD8; --bad:#BE3A33; --bad-soft:#FBE3E1;
  --shadow:0 1px 2px rgba(14,27,34,.06),0 8px 24px rgba(14,27,34,.06);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1215; --surface:#111C20; --surface-2:#16242A; --ink:#E5EEF1; --muted:#8EA0A7; --line:#22333A;
  --accent:#3DC2D1; --accent-ink:#03262B; --accent-soft:#123239;
  --good:#4CC489; --good-soft:#123326; --warn:#E3AA4C; --warn-soft:#352812; --bad:#F27B73; --bad-soft:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1215; --surface:#111C20; --surface-2:#16242A; --ink:#E5EEF1; --muted:#8EA0A7; --line:#22333A;
  --accent:#3DC2D1; --accent-ink:#03262B; --accent-soft:#123239;
  --good:#4CC489; --good-soft:#123326; --warn:#E3AA4C; --warn-soft:#352812; --bad:#F27B73; --bad-soft:#3A1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:21px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* shell */
.app{display:flex;min-height:100vh}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.brand{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top p{margin:2px 0 0;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));
  height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(10,122,138,.35)}
.fab svg{width:22px;height:22px}
@media (min-width:900px){
  nav.tabs{position:sticky;top:0;height:100vh;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 14px}
  .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;padding:4px 12px 18px}
  .brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
  .tab{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  main{padding-block:32px 48px}
  .fab{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:calc(32px + env(safe-area-inset-right,0px))}
}

/* blocks */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--bad)}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.when{flex:none;width:58px;text-align:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:6px 0;font-weight:700;font-size:13px;line-height:1.2}
.when small{display:block;font-weight:600;font-size:11px;opacity:.85}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.banner{border-radius:12px;padding:10px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.mini{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--accent);display:inline-flex;gap:5px;align-items:center}
.mini.done{color:var(--good);border-color:transparent;background:var(--good-soft)}
.mini svg{width:14px;height:14px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--f-display);font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1;max-width:100%;border:0;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums}
.day.out{color:var(--muted);opacity:.45}
.day.today{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day[aria-pressed="true"] .dots i{background:var(--accent-ink)}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,14,17,.45);opacity:0;transition:opacity .2s}
.backdrop.on{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
@media (min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(680px,92vw);border-radius:20px;transform:translate(-50%,-46%);opacity:0;transition:opacity .2s,transform .2s;padding-top:18px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}.sheet .grab{display:none}}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);min-width:0}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 96px 34px;gap:8px;align-items:end}
.item .desc{grid-column:1/-1}
.item input{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.item .line{grid-column:1/2;align-self:center;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.x{width:34px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.totals{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-family:var(--f-display);font-size:20px;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost-bad{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions .wide{grid-column:1/-1}
.create{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.create button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:700}
.create button svg{width:26px;height:26px;color:var(--accent)}
.create button span{font-weight:500;font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.import{display:flex;gap:8px;flex-wrap:wrap}
.sheet{overflow-x:hidden}
.sheet-inner{min-width:0}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.import .btn{flex:1 1 160px;padding:10px 12px;font-size:14px}
.paybox{display:flex;gap:8px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.paybox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
/* paper preview */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.paper-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.paper-head .biz{font-family:var(--f-display);font-size:19px;font-weight:700}
.paper-head .doc{text-align:right}
.paper-head .doc b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.paper th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.paper td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.paper .r{text-align:right}
.meta{font-size:13px;color:var(--muted)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
@media (min-width:900px){.toast{bottom:40px}}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New</button>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
/* ---------- icons ---------- */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  quote:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  inv:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  job:'<path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
};
const ic = (n, sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const r2 = n => Math.round((Number(n)||0)*100)/100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = pISO(s); d.setDate(d.getDate()+n); return iso(d); };
const fDate = s => s ? pISO(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : '';
const fDateLong = s => s ? pISO(s).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}) : '';
const fTime = t => { if(!t) return ''; let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
const initials = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const first = n => (n||'').split(/\s+/)[0] || 'there';

/* ---------- state + store ---------- */
const DEFAULTS = {
  business:'CleaningPower', phone:'', email:'', solaSite:'', taxRate:6.625, dueDays:7,
  tplReminder:'Hi {first}, this is {business} confirming your {service} on {date} at {time} at {address}. Reply C to confirm or call {phone} to reschedule.',
  tplInvoice:'Hi {first}, here is your invoice {number} from {business} for {total}. Pay securely here: {link} Thank you!',

};

const toSnake = k => k.replace(/[A-Z]/g, m => '_' + m.toLowerCase());
const toCamel = k => k.replace(/_([a-z])/g, (m,c) => c.toUpperCase());
function toRow(table, obj){ const row = {}; for(const [k,v] of Object.entries(obj)){ const sk = toSnake(k); if(!ALLOWED[table].includes(sk)) continue; row[sk] = (v === '' && NULLABLE.has(sk)) ? null : v; } return row; }

const hasPicker = () => { try { return 'contacts' in navigator && 'select' in navigator.contacts; } catch(e){ return false; } };
function parseVCards(text){
  const lines = String(text).replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  const out = []; let cur = null;
  const un = v => String(v||'').replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
  for(const raw of lines){
    const i = raw.indexOf(':'); if(i<0) continue;
    const head = raw.slice(0,i), val = raw.slice(i+1);
    const key = head.split(';')[0].split('.').pop().toUpperCase(); const params = head.toUpperCase();
    if(key==='BEGIN' && /VCARD/i.test(val)){ cur = {name:'',phone:'',email:'',address:'',_cell:false}; continue; }
    if(key==='END' && cur){ if(cur.name||cur.phone||cur.email){ delete cur._cell; out.push(cur); } cur=null; continue; }
    if(!cur) continue;
    if(key==='FN' && un(val)) cur.name = un(val);
    else if(key==='N' && !cur.name){ const p = val.split(';').map(un); cur.name = [p[3],p[1],p[2],p[0],p[4]].filter(Boolean).join(' '); }
    else if(key==='ORG' && !cur.name) cur.name = un(val.split(';')[0]);
    else if(key==='TEL'){ const v = un(val).replace(/^tel:/i,''); const cell = /CELL|IPHONE|MOBILE/.test(params); if(v && (!cur.phone || (cell && !cur._cell))){ cur.phone = v; cur._cell = cell; } }
    else if(key==='EMAIL' && !cur.email) cur.email = un(val);
    else if(key==='ADR' && !cur.address){ const p = val.split(';').map(un); cur.address = [p[2], p[3], [p[4],p[5]].filter(Boolean).join(' ')].filter(Boolean).join(', '); }
  }
  return out;
}
async function pickContacts(multiple){
  let props = ['name','tel','email'];
  try { const sup = await navigator.contacts.getProperties(); if(sup.includes('address')) props.push('address'); } catch(e){}
  const res = await navigator.contacts.select(props, {multiple});
  return (res||[]).map(c => { const a = (c.address||[])[0];
    return { name:(c.name||[])[0]||'', phone:(c.tel||[])[0]||'', email:(c.email||[])[0]||'',
      address: a ? [(a.addressLine||[]).join(' '), a.city, [a.region,a.postalCode].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '' }; });
}
function readVcfFiles(files){ return Promise.all([...files].map(f=>f.text())).then(ts => ts.flatMap(parseVCards)); }
function contactImportHTML(p){
  return `<div class="import">${hasPicker()?`<button class="btn" type="button" id="${p}-pick">${ic('users')}Pick from contacts</button>`:''}
    <label class="btn" for="${p}-vcf">${ic('users')}${hasPicker()?'Contact card file':'Add from contacts'}</label>
    <input id="${p}-vcf" type="file" accept=".vcf,text/vcard,text/x-vcard,text/directory" multiple hidden></div>
    ${hasPicker()?'':`<p class="hint">iPhone: in Contacts, open the person → Share Contact → Save to Files. Then tap "Add from contacts" and choose that file.</p>`}`;
}
function bindContactImport(sh, p){
  const put = ct => { if(!ct){ toast('No contact found in that file'); return; }
    [['name','name'],['phone','phone'],['email','email'],['addr','address']].forEach(([id,k]) => { const el=$(`#${p}-${id}`,sh); if(el && ct[k]) el.value = ct[k]; });
    toast('Contact filled in. Check it, then save.'); };
  const pk = $(`#${p}-pick`,sh); if(pk) pk.onclick = async () => { try { put((await pickContacts(false))[0]); } catch(e){ if(e && e.name!=='AbortError' && e.name!=='InvalidStateError') toast('Could not open contacts'); } };
  const f = $(`#${p}-vcf`,sh); if(f) f.onchange = async () => { const list = await readVcfFiles(f.files); f.value=''; put(list[0]); };
}
async function importMany(list){
  const norm = v => String(v||'').replace(/\D/g,'').slice(-10);
  const have = new Set(S.clients.flatMap(c => [norm(c.phone), (c.name||'').toLowerCase()]).filter(Boolean));
  let added = 0, skipped = 0;
  for(const ct of list){
    if(!ct.name){ skipped++; continue; }
    if((ct.phone && have.has(norm(ct.phone))) || have.has(ct.name.toLowerCase())){ skipped++; continue; }
    await save('clients', {...ct, notes:'', createdAt:today()}); added++;
    have.add(norm(ct.phone)); have.add(ct.name.toLowerCase());
  }
  toast(`Added ${added} client${added===1?'':'s'}` + (skipped?` · skipped ${skipped} already saved`:''));
}

    $('#save-client',sh).onclick = async () => { const name=$('#c-name',sh).value.trim(); if(!name){ toast('Enter a name'); return; }
      const n = await save('clients',{...c, name, phone:$('#c-phone',sh).value.trim(), email:$('#c-email',sh).value.trim(), address:$('#c-addr',sh).value.trim(), notes:$('#c-notes',sh).value, createdAt:c.createdAt||today()});
      close(); toast('Client saved'); if(existing) setTimeout(()=>viewClient(n.id),240); };
  });
}
function viewClient(id){
  const c = client(id); if(!c) return;
  const qs = S.quotes.filter(q=>q.clientId===id).map(q=>docRow(q,'quote'));
  const is = S.invoices.filter(i=>i.clientId===id).map(i=>docRow(i,'inv'));
  const js = S.jobs.filter(j=>j.clientId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(jobRow);
  openSheet(sheetTop(c.name) + `
    <div class="card">${c.phone?`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="num">${esc(c.phone)}</span><button class="mini" data-cp="${esc(c.phone)}">${ic('copy',2.4)}Copy</button></div>`:''}
      ${c.email?`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis">${esc(c.email)}</span><button class="mini" data-cp="${esc(c.email)}">${ic('copy',2.4)}Copy</button></div>`:''}
      ${c.address?`<div>${esc(c.address)}</div>`:''}${c.notes?`<div class="meta" style="white-space:pre-wrap">${esc(c.notes)}</div>`:''}
      ${!c.phone&&!c.email&&!c.address?'<div class="meta">No contact details yet.</div>':''}</div>
    <div class="actions"><button class="btn primary" data-n="quote">${ic('quote')}New quote</button><button class="btn" data-n="job">${ic('cal')}Book job</button>
      <button class="btn" data-n="invoice">${ic('inv')}New invoice</button><button class="btn" data-n="edit">Edit</button></div>
    ${is.length?`<div class="section"><h3>Invoices</h3><div class="list">${is.join('')}</div></div>`:''}
    ${qs.length?`<div class="section"><h3>Quotes</h3><div class="list">${qs.join('')}</div></div>`:''}
    ${js.length?`<div class="section"><h3>Jobs</h3><div class="list">${js.join('')}</div></div>`:''}
    <button class="btn ghost-bad" id="del-client">Delete</button>`, (sh,close) => {
    $$('[data-cp]',sh).forEach(b=>b.onclick=()=>copy(b.dataset.cp));
    const go = fn => { close(); setTimeout(fn,230); };
    $$('[data-n]',sh).forEach(b=>b.onclick=()=>go({quote:()=>editDoc('quotes',null,{clientId:id}),invoice:()=>editDoc('invoices',null,{clientId:id}),job:()=>openJob(null,{clientId:id,address:c.address||''}),edit:()=>editClient(c)}[b.dataset.n]));
    $$('[data-inv]',sh).forEach(b=>b.onclick=()=>go(()=>viewDoc('invoices',b.dataset.inv)));
    $$('[data-quote]',sh).forEach(b=>b.onclick=()=>go(()=>viewDoc('quotes',b.dataset.quote)));
    $$('[data-job]',sh).forEach(b=>b.onclick=()=>go(()=>openJob(S.jobs.find(j=>j.id===b.dataset.job))));
    $$('[data-remind]',sh).forEach(b=>b.onclick=()=>go(()=>sendReminder(S.jobs.find(j=>j.id===b.dataset.remind))));
    armDelete($('#del-client',sh), async()=>{ await remove('clients',id); close(); toast('Client deleted'); });
  });
}

/* ---------- settings ---------- */
function openSettings(){
  const s = S.settings;
  openSheet(sheetTop('Settings') + `
    <div class="card"><h3>Business</h3>
      <div class="field"><label for="s-biz">Business name</label><input id="s-biz" value="${esc(s.business)}"></div>
      <div class="grid2"><div class="field"><label for="s-phone">Phone</label><input id="s-phone" type="tel" value="${esc(s.phone)}"></div><div class="field"><label for="s-email">Email</label><input id="s-email" type="email" value="${esc(s.email)}"></div></div>
      <div class="grid2"><div class="field"><label for="s-tax">Default tax %</label><input id="s-tax" type="number" step="0.001" value="${esc(s.taxRate)}"></div><div class="field"><label for="s-due">Invoice due (days)</label><input id="s-due" type="number" value="${esc(s.dueDays)}"></div></div></div>
    <div class="card"><h3>Sola payments</h3>
      <div class="field"><label for="s-sola">PaymentSITE name or full link</label><input id="s-sola" placeholder="cleaningpower  or  https://secure.cardknox.com/cleaningpower" value="${esc(s.solaSite)}"></div>
      <p class="hint">Find it in your Sola merchant portal under PaymentSITE. Each invoice link fills in the amount, invoice #, name, email and phone. Make sure those fields are turned on for your PaymentSITE, or Sola ignores them.</p></div>
    <div class="card"><h3>Text templates</h3>
      <p class="hint">Fill-ins: {first} {name} {business} {phone} · reminders: {service} {date} {time} {address} · quotes and invoices: {number} {total} {items} {link}</p>
      <div class="field"><label for="s-tr">Appointment reminder</label><textarea id="s-tr">${esc(s.tplReminder)}</textarea></div>
      <div class="field"><label for="s-tq">Quote</label><textarea id="s-tq">${esc(s.tplQuote)}</textarea></div>
      <div class="field"><label for="s-ti">Invoice</label><textarea id="s-ti">${esc(s.tplInvoice)}</textarea></div></div>
    <button class="btn primary" id="save-settings">Save settings</button>
    <div class="card"><h3>Password</h3>
      <div class="field"><label for="s-newpass">New password</label><input id="s-newpass" type="password" autocomplete="new-password" minlength="8"></div>
      <button class="btn" id="change-pass">Change password</button></div>
    <button class="btn" id="sign-out">Sign out</button>`, (sh,close) => {
    $('#save-settings',sh).onclick = async () => {
      await saveSettings({ business:$('#s-biz',sh).value.trim()||'My business', phone:$('#s-phone',sh).value.trim(), email:$('#s-email',sh).value.trim(),
        taxRate:Number($('#s-tax',sh).value)||0, dueDays:Number($('#s-due',sh).value)||0, solaSite:$('#s-sola',sh).value.trim(),
        tplReminder:$('#s-tr',sh).value, tplQuote:$('#s-tq',sh).value, tplInvoice:$('#s-ti',sh).value });
      close(); toast('Settings saved'); };
    $('#sign-out',sh).onclick = async () => { close(); await sb.auth.signOut(); };
    $('#change-pass',sh).onclick = async () => { const p=$('#s-newpass',sh).value; if(p.length<8){ toast('Use at least 8 characters'); return; }
      const { error } = await sb.auth.updateUser({ password:p }); if(error){ toast(error.message); return; } $('#s-newpass',sh).value=''; toast('Password changed'); };
  });
}

route();
boot();
})();
</script>
